name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    # Self-hosted Windows build PC (GitHub-hosted jobs are blocked by the account's spending limit).
    # Node comes from the pinned setup action; Bun and ffmpeg (test-only) from pinned, hash-checked downloads.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    defaults:
      run:
        # Windows PowerShell 5.1: the Store-installed pwsh cannot be started by the runner service.
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - name: Install Bun 1.4.4 (pinned download; bunx is a copy, not a symlink)
        # oven-sh/setup-bun symlinks bunx.exe, which fails with EPERM for a runner account
        # without the symlink privilege. Download the pinned release, check its hash, and copy instead.
        env:
          BUN_VERSION: 1.4.4
          BUN_SHA256: cd2c0fccc78f3ede1f50ca827a15f063eda13d4d150a3d0674f4f6e323d864a5
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          [Net.ServicePointManager]::SecurityProtocol = [Net.ServicePointManager]::SecurityProtocol -bor [Net.SecurityProtocolType]::Tls12
          $root = Join-Path $env:RUNNER_TEMP "bun-$env:BUN_VERSION"
          if (Test-Path $root) { Remove-Item $root -Recurse -Force }
          New-Item -ItemType Directory -Path $root | Out-Null
          $zip = Join-Path $root 'bun-windows-x64.zip'
          Invoke-WebRequest -UseBasicParsing -Uri "https://github.com/oven-sh/bun/releases/download/bun-v$env:BUN_VERSION/bun-windows-x64.zip" -OutFile $zip
          $hash = (Get-FileHash -Path $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:BUN_SHA256) { Write-Host "::error::bun-windows-x64.zip SHA256 mismatch (got $hash)"; exit 1 }
          Expand-Archive -Path $zip -DestinationPath $root -Force
          $bin = Join-Path $root 'bun-windows-x64'
          Copy-Item -Path (Join-Path $bin 'bun.exe') -Destination (Join-Path $bin 'bunx.exe') -Force
          Add-Content -Path $env:GITHUB_PATH -Value $bin -Encoding UTF8
          & (Join-Path $bin 'bun.exe') --version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & (Join-Path $bin 'bunx.exe') --version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Install ffmpeg 9.0.2 (pinned download; test-only, used by tests/e2e to validate exported MP4s)
        # Gyan.dev essentials build (includes ffprobe) from its versioned GitHub release. Nothing is installed
        # on the machine: it is unpacked under RUNNER_TEMP and added to PATH for later steps only.
        env:
          FFMPEG_VERSION: 9.0.2
          FFMPEG_SHA256: 60f467265b1e312373dbcd92200c2618a74850f98d3d078e94296bb3fa2047ba
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          [Net.ServicePointManager]::SecurityProtocol = [Net.ServicePointManager]::SecurityProtocol -bor [Net.SecurityProtocolType]::Tls12
          $root = Join-Path $env:RUNNER_TEMP "ffmpeg-$env:FFMPEG_VERSION"
          if (Test-Path $root) { Remove-Item $root -Recurse -Force }
          New-Item -ItemType Directory -Path $root | Out-Null
          $name = "ffmpeg-$env:FFMPEG_VERSION-essentials_build"
          $zip = Join-Path $root "$name.zip"
          # WebClient, not Invoke-WebRequest: on Windows PowerShell 5.1 Invoke-WebRequest manages ~0.4 MB/s for this 115 MB file.
          (New-Object Net.WebClient).DownloadFile("https://github.com/GyanD/codexffmpeg/releases/download/$env:FFMPEG_VERSION/$name.zip", $zip)
          $hash = (Get-FileHash -Path $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:FFMPEG_SHA256) { Write-Host "::error::$name.zip SHA256 mismatch (got $hash)"; exit 1 }
          # ZipFile, not Expand-Archive, which is very slow on 5.1 for a ~320 MB unpacked archive.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [IO.Compression.ZipFile]::ExtractToDirectory($zip, $root)
          Remove-Item $zip
          $bin = Join-Path (Join-Path $root $name) 'bin'
          Add-Content -Path $env:GITHUB_PATH -Value $bin -Encoding UTF8
          & (Join-Path $bin 'ffmpeg.exe') -hide_banner -version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & (Join-Path $bin 'ffprobe.exe') -hide_banner -version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install build tools
        run: |
          npm install --no-audit --no-fund
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npx playwright install chromium
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          foreach ($tool in 'ffmpeg', 'ffprobe') {
            if (-not (Get-Command $tool -ErrorAction SilentlyContinue)) { Write-Host "::error::$tool is not on PATH (expected from the pinned ffmpeg step)"; exit 1 }
          }
          $ffmpeg = @(ffmpeg -hide_banner -version)
          $ffmpeg[0]
      - name: Type-check (engine and UI)
        run: npx tsc -p tsconfig.json
      - name: Unit and host checks (includes "dist/ is up to date")
        run: bun test tests/unit
      - name: Browser tests against the committed dist/
        run: |
          $server = Start-Process node -ArgumentList 'tests/serve.mjs','8790' -WindowStyle Hidden -PassThru
          Set-Content -Path (Join-Path $env:RUNNER_TEMP 'capstan-serve.pid') -Value $server.Id
          $deadline = (Get-Date).AddSeconds(15)
          function Test-Port { $c = New-Object Net.Sockets.TcpClient; try { $c.Connect('127.0.0.1', 8790); $true } catch { $false } finally { $c.Dispose() } }
          while (-not (Test-Port)) {
            if ($server.HasExited -or (Get-Date) -gt $deadline) { Write-Host '::error::tests/serve.mjs did not start on port 8790'; exit 1 }
            Start-Sleep -Milliseconds 250
          }
          npm run test:e2e
      - name: Stop the test server
        # Always runs, so a failed or cancelled job does not leave node.exe holding port 8790 on the runner.
        if: always()
        run: |
          $pidFile = Join-Path $env:RUNNER_TEMP 'capstan-serve.pid'
          if (Test-Path $pidFile) {
            Stop-Process -Id ([int](Get-Content $pidFile)) -Force -ErrorAction SilentlyContinue
            Remove-Item $pidFile
          }
      - name: Keep screenshots and exported files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-output
          path: tests/e2e/.out/
          if-no-files-found: ignore

  windows-host:
    # The real PowerShell 5.1 host: lifecycle rule with simulated time, then a live host that must
    # write its runtime file, accept the heartbeat and leaving beacon, and stop itself.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Host lifecycle (Windows PowerShell 5.1)
        shell: powershell
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File tests\ps\Lifecycle.Tests.ps1
      - name: SnapShackle captures routes (Windows PowerShell 5.1)
        shell: powershell
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File tests\ps\Captures.Tests.ps1
      - name: Media library on disk (Windows PowerShell 5.1)
        shell: powershell
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File tests\ps\Library.Tests.ps1
      - name: Speech-to-text endpoint (Windows PowerShell 5.1, fake engine)
        shell: powershell
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File tests\ps\Speech.Tests.ps1
      - name: Cursor capture (Windows PowerShell 5.1, scripted input only)
        shell: powershell
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File tests\ps\CursorCapture.Tests.ps1
      - name: Hotkeys and tray, synthetic input only (Windows PowerShell 5.1)
        shell: powershell
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File tests\ps\Hotkeys.Tests.ps1
      - name: Fleet actions (Pester 5, Windows PowerShell 5.1)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\vendor\Pester\Restore.ps1
          Import-Module .\vendor\Pester\Pester.psd1
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = 'tests\ps\FleetAction.Tests.ps1'
          $cfg.Run.Exit = $true
          Invoke-Pester -Configuration $cfg
